name: chat-pdf

services:
  app:
    build:
      context: ../backend
    # host networking: Ollama on this machine listens on 127.0.0.1:11434
    # only, which bridge-networked containers cannot reach. Host mode lets
    # the app container see the host's loopback interface directly.
    network_mode: host
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://chatpdf:chatpdf@localhost:5432/chatpdf
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      OLLAMA_BASE_URL: http://localhost:11434
      STORAGE_ROOT: /data/documents
    volumes:
      - document_storage:/data/documents
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g

  # worker-io handles file I/O: PDF extraction, file storage, OCR,
  # and scheduled hard-delete.  Separate from worker-llm to avoid
  # file I/O competing with CPU-bound LLM inference.
  worker-io:
    build:
      context: ../backend
    network_mode: host
    command: celery -A app.workers.celery_app:celery worker -Q worker-io -c 2 --loglevel=info
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://chatpdf:chatpdf@localhost:5432/chatpdf
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      OLLAMA_BASE_URL: http://localhost:11434
      STORAGE_ROOT: /data/documents
    volumes:
      - document_storage:/data/documents
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

  # celery-beat schedules the hard-delete worker.
  celery-beat:
    build:
      context: ../backend
    network_mode: host
    command: >
      celery -A app.workers.celery_app:celery beat --loglevel=info
      --schedule /tmp/celerybeat-schedule
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://chatpdf:chatpdf@localhost:5432/chatpdf
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      OLLAMA_BASE_URL: http://localhost:11434
      STORAGE_ROOT: /data/documents
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 256m

  # frontend (React + Nginx)
  frontend:
    build:
      context: ../frontend
    # host networking: this environment does not route container-to-container
    # traffic through the bridge gateway IP to a published port (hairpin NAT
    # is blocked), so frontend and app must share the host's network stack.
    network_mode: host
    depends_on:
      - app

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatpdf
      POSTGRES_PASSWORD: chatpdf
      POSTGRES_DB: chatpdf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatpdf"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  postgres_data:
  document_storage:
  hf_cache:
