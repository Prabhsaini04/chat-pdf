[project]
name = "chat-pdf-backend"
version = "0.1.0"
description = "chat-pdf FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<0.4",
    "celery>=5.4,<6",
    "redis>=6.1,<7",
    "argon2-cffi>=23.1,<24",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.12,<0.1",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
# Heavy ML/processing deps — installed in Docker images, skipped in CI.
# CI uses [dev] only; Docker Compose app/worker images use pip install ".[ml]".
ml = [
    "pymupdf>=1.24,<2",
    "pytesseract>=0.3,<0.4",
    "pillow>=10,<12",
    "sentence-transformers>=3.3,<4",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends()`-as-default-argument is the framework's own
# idiomatic dependency-injection pattern, not the footgun this rule exists
# to catch (a mutable/expensive default evaluated once at import time) —
# FastAPI re-evaluates it per request. Ignoring project-wide rather than
# per-call, since every route in this codebase uses the same pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "isolation: cross-tenant isolation tests (ENG-CPD-006) — required CI gate, must never be skipped on a PR touching documents/chunks/conversations/auth",
    "rate_limiting: rate limiting and concurrency control tests (ENG-CPD-007) — required CI gate on any PR touching rate_limiting/ or question/upload endpoints",
]
